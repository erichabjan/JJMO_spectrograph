# Example configuration: Sirius A observations from JJMO
# --------------------------------------------------------
# Sirius A (alpha CMa, A1V) is a primary CALSPEC flux standard.
# 8 segments covering 3900-7900 A, observed on 2004-01-29.
#
# Usage:
#   jjmo-fluxcal run --input-dir /path/to/Sirius --config sirius_config.yaml

star_name: sirius

# File format (auto-detected if null)
file_format: null      # Sirius data: .fit + .txt pairs

# Observing conditions
airmass: 1.3           # Approximate airmass at JJMO for Sirius (dec = -16)
exptime: null          # Read from FITS header

# Wavelength calibration
min_depth_sigma: 3.0
line_match_tolerance: 50.0

# Quality assessment
edge_trim_frac: 0.20
cosmic_sigma: 5.0

# Stitching
normalize_segments: true
norm_method: median_ratio

# Reference spectrum
prefer_reference: calspec
ebv: 0.0              # Sirius is 2.6 pc away; negligible extinction
rv: 3.1
extinction_law: odonnell
atmospheric_extinction: kpno

# Sensitivity function
fit_method: chebyshev
fit_order: 4
sigma_clip: 3.0
n_clip_iterations: 3
mask_balmer: true
mask_telluric: true
mask_metals: true
balmer_half_width: 15.0
metal_half_width: 5.0

# Output
output_format: fits
log_level: INFO
